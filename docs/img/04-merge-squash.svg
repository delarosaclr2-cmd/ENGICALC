<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Comparación: el merge normal conserva los commits de la rama y agrega un commit de unión; el squash merge deja un solo commit en main" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <text x="16" y="22" font-size="14" font-weight="600" fill="#17324D">Merge normal frente a squash merge</text>
  <text x="16" y="46" font-weight="600" fill="#17324D">Merge normal: conserva cada commit</text>
  <path d="M120 112 C135 84 140 84 160 84 L270 84 C300 84 310 112 330 112" stroke="#0E7C7B" stroke-width="3" fill="none"/>
  <line x1="40" y1="112" x2="380" y2="112" stroke="#17324D" stroke-width="3"/>
  <circle cx="60" cy="112" r="6" fill="#17324D"/>
  <circle cx="120" cy="112" r="6" fill="#17324D"/>
  <circle cx="330" cy="112" r="6" fill="#17324D"/>
  <circle cx="190" cy="84" r="6" fill="#0E7C7B"/>
  <circle cx="260" cy="84" r="6" fill="#0E7C7B"/>
  <text x="190" y="72" text-anchor="middle" font-size="11" fill="#222">commit a1</text>
  <text x="260" y="72" text-anchor="middle" font-size="11" fill="#222">commit a2</text>
  <text x="330" y="134" text-anchor="middle" font-size="11" fill="#222">commit de unión</text>
  <text x="16" y="168" font-weight="600" fill="#17324D">Squash merge: un solo commit en main</text>
  <line x1="160" y1="192" x2="270" y2="192" stroke="#AAB4BE" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="190" cy="192" r="5" fill="#AAB4BE"/>
  <circle cx="240" cy="192" r="5" fill="#AAB4BE"/>
  <text x="215" y="212" text-anchor="middle" font-size="11" fill="#555">commits de la rama, ya fuera de main</text>
  <line x1="40" y1="236" x2="380" y2="236" stroke="#17324D" stroke-width="3"/>
  <circle cx="60" cy="236" r="6" fill="#17324D"/>
  <circle cx="120" cy="236" r="6" fill="#17324D"/>
  <circle cx="260" cy="236" r="6" fill="#0E7C7B"/>
  <text x="260" y="256" text-anchor="middle" font-size="11" fill="#222">un commit con todos los cambios del PR</text>
  <text x="16" y="282" font-size="11" fill="#555">Merge conserva el detalle paso a paso. Squash deja la historia de main con una línea por tarea.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
