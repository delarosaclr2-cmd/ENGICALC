<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 205" role="img" aria-label="Ramas: la rama de la tarea se aísla de main y después se une con un commit de merge" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <text x="16" y="22" font-size="14" font-weight="600" fill="#17324D">Ramas y commits: la tarea se aísla y luego se une a main</text>
  <line x1="40" y1="70" x2="740" y2="70" stroke="#17324D" stroke-width="3"/>
  <text x="40" y="56" font-weight="600" fill="#17324D">main</text>
  <path d="M180 70 C200 140 210 140 240 140 L340 140 C380 140 400 70 440 70" stroke="#0E7C7B" stroke-width="3" fill="none"/>
  <text x="300" y="186" text-anchor="middle" font-weight="600" fill="#0E7C7B">rama feature/tu-nombre/tarea</text>
  <circle cx="80" cy="70" r="7" fill="#17324D"/>
  <text x="80" y="100" text-anchor="middle" fill="#222">Rev. 0</text>
  <circle cx="180" cy="70" r="7" fill="#17324D"/>
  <text x="180" y="50" text-anchor="middle" fill="#222">main actualizado</text>
  <circle cx="260" cy="140" r="7" fill="#0E7C7B"/>
  <text x="260" y="162" text-anchor="middle" fill="#222">commit 1</text>
  <circle cx="340" cy="140" r="7" fill="#0E7C7B"/>
  <text x="340" y="162" text-anchor="middle" fill="#222">commit 2</text>
  <circle cx="440" cy="70" r="7" fill="#17324D"/>
  <text x="440" y="50" text-anchor="middle" fill="#222">merge a main</text>
  <circle cx="600" cy="70" r="7" fill="#17324D"/>
  <text x="600" y="100" text-anchor="middle" fill="#222">siguiente tarea</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
