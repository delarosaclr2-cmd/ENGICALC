<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="Ciclo de un pull request: el autor abre el PR, el revisor decide si aprueba o pide cambios, y el autor corrige hasta obtener aprobación" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <text x="16" y="22" font-size="14" font-weight="600" fill="#17324D">Ciclo de un pull request</text>
  <rect x="20" y="50" width="160" height="60" rx="8" fill="#EEF3F6" stroke="#17324D"/>
  <text x="100" y="76" text-anchor="middle" font-weight="600" fill="#17324D">1 · Autor abre el PR</text>
  <text x="100" y="96" text-anchor="middle" font-size="11" fill="#555">gh pr create</text>
  <rect x="230" y="50" width="160" height="60" rx="8" fill="#EEF3F6" stroke="#17324D"/>
  <text x="310" y="76" text-anchor="middle" font-weight="600" fill="#17324D">2 · Revisor revisa</text>
  <text x="310" y="96" text-anchor="middle" font-size="11" fill="#555">Files changed</text>
  <rect x="440" y="50" width="120" height="60" rx="8" fill="#FFFFFF" stroke="#17324D" stroke-dasharray="4 3"/>
  <text x="500" y="86" text-anchor="middle" font-weight="600" fill="#17324D">¿Aprobado?</text>
  <rect x="610" y="50" width="130" height="60" rx="8" fill="#17324D" stroke="#17324D"/>
  <text x="675" y="76" text-anchor="middle" font-weight="600" fill="#FFFFFF">3 · Merge</text>
  <text x="675" y="96" text-anchor="middle" font-size="11" fill="#DDE6EE">a main</text>
  <rect x="230" y="150" width="160" height="60" rx="8" fill="#EEF3F6" stroke="#17324D"/>
  <text x="310" y="176" text-anchor="middle" font-weight="600" fill="#17324D">Pide cambios</text>
  <text x="310" y="196" text-anchor="middle" font-size="11" fill="#555">--request-changes</text>
  <rect x="20" y="150" width="160" height="60" rx="8" fill="#EEF3F6" stroke="#17324D"/>
  <text x="100" y="176" text-anchor="middle" font-weight="600" fill="#17324D">Autor corrige</text>
  <text x="100" y="196" text-anchor="middle" font-size="11" fill="#555">commit y push</text>
  <line x1="180" y1="80" x2="230" y2="80" stroke="#17324D" stroke-width="1.5"/>
  <polygon points="230,80 223,76 223,84" fill="#17324D"/>
  <line x1="390" y1="80" x2="440" y2="80" stroke="#17324D" stroke-width="1.5"/>
  <polygon points="440,80 433,76 433,84" fill="#17324D"/>
  <line x1="560" y1="80" x2="610" y2="80" stroke="#17324D" stroke-width="1.5"/>
  <polygon points="610,80 603,76 603,84" fill="#17324D"/>
  <text x="585" y="72" text-anchor="middle" font-size="11" fill="#17324D">sí</text>
  <line x1="470" y1="110" x2="370" y2="150" stroke="#17324D" stroke-width="1.5"/>
  <polygon points="370,150 366,159 376,158" fill="#17324D"/>
  <text x="436" y="140" text-anchor="middle" font-size="11" fill="#17324D">no</text>
  <line x1="230" y1="180" x2="180" y2="180" stroke="#17324D" stroke-width="1.5"/>
  <polygon points="180,180 187,176 187,184" fill="#17324D"/>
  <line x1="100" y1="150" x2="100" y2="112" stroke="#17324D" stroke-width="1.5"/>
  <polygon points="100,112 96,119 104,119" fill="#17324D"/>
  <text x="110" y="134" font-size="11" fill="#555">el PR se actualiza</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
