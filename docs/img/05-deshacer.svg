<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-label="Escalera de deshacer cambios: de la opción más leve a la más fuerte" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <text x="16" y="22" font-size="14" font-weight="600" fill="#17324D">Deshacer cambios: de lo más leve a lo más fuerte</text>
  <rect x="16" y="110" width="170" height="70" rx="6" fill="#EEF3F6" stroke="#17324D"/>
  <text x="101" y="134" text-anchor="middle" font-weight="600" fill="#17324D">1 · /rewind</text>
  <text x="101" y="154" text-anchor="middle" font-size="11" fill="#555">cambios de la sesión</text>
  <text x="101" y="170" text-anchor="middle" font-size="11" fill="#555">de Claude Code</text>
  <rect x="200" y="90" width="170" height="90" rx="6" fill="#D7E6EA" stroke="#17324D"/>
  <text x="285" y="114" text-anchor="middle" font-weight="600" fill="#17324D">2 · git restore .</text>
  <text x="285" y="134" text-anchor="middle" font-size="11" fill="#555">descarta cambios</text>
  <text x="285" y="150" text-anchor="middle" font-size="11" fill="#555">no guardados</text>
  <text x="285" y="168" text-anchor="middle" font-size="11" fill="#B03A2E">se pierden</text>
  <rect x="384" y="70" width="170" height="110" rx="6" fill="#B9D6DC" stroke="#17324D"/>
  <text x="469" y="94" text-anchor="middle" font-weight="600" fill="#17324D">3 · git revert</text>
  <text x="469" y="114" text-anchor="middle" font-size="11" fill="#555">deshace un commit</text>
  <text x="469" y="130" text-anchor="middle" font-size="11" fill="#555">ya guardado; crea</text>
  <text x="469" y="146" text-anchor="middle" font-size="11" fill="#555">uno nuevo sin borrar</text>
  <text x="469" y="164" text-anchor="middle" font-size="11" fill="#555">el historial</text>
  <rect x="568" y="40" width="176" height="140" rx="6" fill="#17324D" stroke="#17324D"/>
  <text x="656" y="70" text-anchor="middle" font-weight="600" fill="#FFFFFF">4 · Reclonar</text>
  <text x="656" y="92" text-anchor="middle" font-size="11" fill="#DDE6EE">git clone en otra</text>
  <text x="656" y="108" text-anchor="middle" font-size="11" fill="#DDE6EE">carpeta, para PC o</text>
  <text x="656" y="124" text-anchor="middle" font-size="11" fill="#DDE6EE">carpeta dañada</text>
  <text x="656" y="150" text-anchor="middle" font-size="11" fill="#DDE6EE">después, recrea .venv</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
