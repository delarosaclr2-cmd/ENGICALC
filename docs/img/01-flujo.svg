<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" role="img" aria-label="Flujo de trabajo en cinco pasos: actualizar main, crear rama, guardar y subir, pull request, integrar" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <text x="16" y="22" font-size="14" font-weight="600" fill="#17324D">Flujo de trabajo: una tarea = una rama</text>
  <rect x="16" y="40" width="118" height="80" rx="8" fill="#EEF3F6" stroke="#17324D"/>
  <text x="75" y="62" text-anchor="middle" font-weight="600" fill="#17324D">1 · Actualizar</text>
  <text x="75" y="82" text-anchor="middle" fill="#222">main</text>
  <text x="75" y="103" text-anchor="middle" font-size="11" fill="#555">git pull</text>
  <line x1="138" y1="80" x2="156" y2="80" stroke="#17324D" stroke-width="1.5"/>
  <polygon points="158,80 151,76 151,84" fill="#17324D"/>
  <rect x="161" y="40" width="118" height="80" rx="8" fill="#EEF3F6" stroke="#17324D"/>
  <text x="220" y="62" text-anchor="middle" font-weight="600" fill="#17324D">2 · Crear rama</text>
  <text x="220" y="82" text-anchor="middle" fill="#222">rama de la tarea</text>
  <text x="220" y="103" text-anchor="middle" font-size="11" fill="#555">git switch -c</text>
  <line x1="283" y1="80" x2="301" y2="80" stroke="#17324D" stroke-width="1.5"/>
  <polygon points="303,80 296,76 296,84" fill="#17324D"/>
  <rect x="306" y="40" width="118" height="80" rx="8" fill="#EEF3F6" stroke="#17324D"/>
  <text x="365" y="62" text-anchor="middle" font-weight="600" fill="#17324D">3 · Guardar</text>
  <text x="365" y="82" text-anchor="middle" fill="#222">commit y push</text>
  <text x="365" y="103" text-anchor="middle" font-size="11" fill="#555">git push -u origin</text>
  <line x1="428" y1="80" x2="446" y2="80" stroke="#17324D" stroke-width="1.5"/>
  <polygon points="448,80 441,76 441,84" fill="#17324D"/>
  <rect x="451" y="40" width="118" height="80" rx="8" fill="#EEF3F6" stroke="#17324D"/>
  <text x="510" y="62" text-anchor="middle" font-weight="600" fill="#17324D">4 · Pull request</text>
  <text x="510" y="82" text-anchor="middle" fill="#222">pide revisión</text>
  <text x="510" y="103" text-anchor="middle" font-size="11" fill="#555">gh pr create</text>
  <line x1="573" y1="80" x2="591" y2="80" stroke="#17324D" stroke-width="1.5"/>
  <polygon points="593,80 586,76 586,84" fill="#17324D"/>
  <rect x="596" y="40" width="118" height="80" rx="8" fill="#17324D" stroke="#17324D"/>
  <text x="655" y="62" text-anchor="middle" font-weight="600" fill="#FFFFFF">5 · Integrar</text>
  <text x="655" y="82" text-anchor="middle" fill="#FFFFFF">merge a main</text>
  <text x="655" y="103" text-anchor="middle" font-size="11" fill="#DDE6EE">tras aprobación</text>
  <text x="380" y="140" text-anchor="middle" font-size="11" fill="#555">Si la revisión pide cambios: corriges en la misma rama, haces commit y push, y el PR se actualiza.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
